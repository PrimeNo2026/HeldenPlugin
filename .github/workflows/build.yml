name: Build Plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: ZIP entpacken
        run: unzip -o HeldenPlugin-Source.zip

      - name: Paper-Version setzen (optional, aus paper-version.txt)
        run: |
          if [ -f paper-version.txt ]; then
            V=$(tr -d '[:space:]' < paper-version.txt)
            sed -i "s|<version>26.3-R0.1-SNAPSHOT</version>|<version>$V</version>|" HeldenPlugin/pom.xml
          fi

      - name: Bauen
        run: mvn -B package
        working-directory: HeldenPlugin

      - name: Jar hochladen
        uses: actions/upload-artifact@v4
        with:
          name: HeldenPlugin-jar
          path: HeldenPlugin/target/HeldenPlugin-*.jar
